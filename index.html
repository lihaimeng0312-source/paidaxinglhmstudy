<style>
/* ============ tokens ============ */
:root{
  --bg:#F2F5F0; --bg2:#E9EEE7; --card:#FFFFFF; --ink:#1C2A24; --ink2:#5A6B63; --ink3:#8A988F;
  --line:#DCE4DB; --line2:#C9D4C8;
  --brand:#0E7A5F; --brand2:#0B5E4B; --brand-bg:#E3F1EA;
  --amber:#B45309; --amber-bg:#FBF0DC; --amber-line:#EBD9AE;
  --danger:#B83A2E; --danger-bg:#FBEBE7;
  --ok:#2F8F5B; --ok-bg:#E5F3EA;
  --blue:#2C6E8F; --blue-bg:#E4EFF5;
  --radius:12px; --radius-s:8px;
  --shadow:0 1px 2px rgba(28,42,36,.05), 0 8px 24px rgba(28,42,36,.05);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --nav-w:232px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::selection{background:var(--brand-bg)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.3}

/* ============ layout ============ */
#app{display:flex;min-height:100vh}
#nav{width:var(--nav-w);flex:0 0 var(--nav-w);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;z-index:40}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-badge{width:38px;height:38px;border-radius:11px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.logo b{font-family:var(--serif);font-size:17px;display:block;line-height:1.2}
.logo span{font-size:11.5px;color:var(--ink2);display:block}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:14.5px;margin-bottom:2px;transition:background .15s,color .15s}
.nav-item:hover{background:var(--bg2);color:var(--ink)}
.nav-item.active{background:var(--brand-bg);color:var(--brand2);font-weight:600}
.nav-item .n-ic{display:flex;flex:0 0 auto}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
#nav .nav-foot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.fresh{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:12px;color:var(--ink2);word-break:break-all}
#main{flex:1;min-width:0;padding:28px 34px 80px;max-width:1180px;margin:0 auto;width:100%}

/* ============ bottom nav (tablet / phone) ============ */
#bottomnav{display:none}

/* ============ typography & blocks ============ */
.page-head{margin-bottom:22px}
.page-head .kicker{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--brand);margin-bottom:6px}
.page-head h1{font-size:26px;letter-spacing:.01em}
.page-head p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.section{margin-bottom:26px}
.section-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.section-h h2{font-size:17.5px}
.section-h .sub{font-size:12.5px;color:var(--ink3)}
.section-h .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card.flat{box-shadow:none}
.card.warn{border-color:var(--amber-line);background:#FFFCF4}
.card.danger{border-color:#EBC4BC;background:var(--danger-bg)}
.empty{color:var(--ink3);text-align:center;padding:26px 12px;font-size:13.5px}
.empty b{color:var(--ink2);display:block;font-size:14.5px;margin-bottom:3px}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;transition:background .15s,border-color .15s,opacity .15s;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.ghost{background:var(--card);border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand2)}
.btn.soft{background:var(--brand-bg);color:var(--brand2)}
.btn.soft:hover{background:#D5E9DF}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .bi{display:flex}
/* ============ chips / badges ============ */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.urgent{background:var(--danger-bg);color:var(--danger)}
.chip.soon{background:var(--amber-bg);color:var(--amber)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.info{background:var(--blue-bg);color:var(--blue)}
.chip.neutral{background:var(--bg2);color:var(--ink2)}
.chip.brand{background:var(--brand-bg);color:var(--brand2)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.badge.todo{background:var(--amber-bg);color:var(--amber)}

/* ============ lists / rows ============ */
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .r-main{flex:1;min-width:0}
.row .r-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .r-sub{font-size:12.5px;color:var(--ink2);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .r-act{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.linkout{color:var(--blue);display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600}
.linkout:hover{text-decoration:underline}
.muted{color:var(--ink3);font-size:12.5px}

/* ============ checkbox ============ */
.check{flex:0 0 26px;width:26px;height:26px;border:2px solid var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
button.check:hover{border-color:var(--brand)}
.check.on{background:var(--brand);border-color:var(--brand)}
.check .ck-svg{opacity:0;transform:scale(.5);transition:all .15s}
.check.on .ck-svg{opacity:1;transform:scale(1)}
.task-done .r-title{color:var(--ink3);text-decoration:line-through}
.task-done .r-sub{color:var(--ink3)}

/* ============ stats ============ */
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .s-num{font-family:var(--serif);font-size:26px;font-weight:900;line-height:1.1}
.stat .s-lab{font-size:12.5px;color:var(--ink2);margin-top:2px}
.stat .s-num.u{color:var(--danger)} .stat .s-num.w{color:var(--amber)} .stat .s-num.g{color:var(--ok)} .stat .s-num.b{color:var(--blue)}

/* ============ course cards ============ */
.coursegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.course-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s,transform .15s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.course-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-tag{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 36px;font-family:var(--serif);font-weight:700;font-size:13px}
.cc-name{font-weight:700;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-meta{font-size:12px;color:var(--ink3)}
.cc-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}

/* ============ tabs ============ */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--brand2);border-bottom-color:var(--brand)}
.tab .cnt{font-size:11.5px;background:var(--bg2);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--ink2)}
.tab.active .cnt{background:var(--brand-bg);color:var(--brand2)}

/* ============ forms ============ */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--card);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink3);margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:12px;box-shadow:var(--shadow)}
details.acc summary{padding:13px 16px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
details.acc summary::-webkit-details-marker{display:none}
details.acc .acc-body{padding:2px 16px 16px;border-top:1px solid var(--line)}

/* ============ notes ============ */
.note-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.note-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.note-head .nh-title{font-weight:700;font-size:14.5px}
.note-head .nh-sub{font-size:12px;color:var(--ink3)}
.note-body{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note-col .nc-lab{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.note-col .nc-txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.note-col textarea{min-height:120px}
@media(max-width:760px){.note-body{grid-template-columns:1fr}}

/* ============ quiz ============ */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.q-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2);margin-bottom:14px;flex-wrap:wrap}
.q-stem{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.5}
.q-point{font-size:12px;color:var(--brand2);background:var(--brand-bg);border-radius:999px;padding:1px 9px;display:inline-block;margin-bottom:10px}
.q-opts{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border:1.5px solid var(--line2);border-radius:10px;cursor:pointer;font-size:14px;transition:border-color .12s,background .12s}
.q-opt:hover{border-color:var(--brand)}
.q-opt.sel{border-color:var(--brand);background:var(--brand-bg)}
.q-opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.q-opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
.q-opt .qk{flex:0 0 22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.q-opt.sel .qk{background:var(--brand);color:#fff;border-color:var(--brand)}
.q-opt.correct .qk{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-opt.wrong .qk{background:var(--danger);color:#fff;border-color:var(--danger)}
.q-answer{margin-top:8px;padding:11px 14px;border-radius:10px;font-size:13.5px;background:var(--bg2)}
.q-answer b{color:var(--brand2)}
.q-bar{height:7px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-bottom:16px}
.q-bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.q-result{text-align:center;padding:22px 0 8px}
.q-result .score{font-family:var(--serif);font-size:44px;font-weight:900}
.q-result .score small{font-size:16px;color:var(--ink3);font-weight:600}

/* ============ modal / toast ============ */
#modal{position:fixed;inset:0;background:rgba(18,30,24,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
#modal.open{display:flex}
.modal-card{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h3{font-size:18px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ week plan ============ */
.day-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.day-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.day-head .dh-date{font-family:var(--serif);font-weight:700;font-size:15px}
.day-head .dh-flag{font-size:12px;color:var(--ink2)}
.day-head .dh-tag{margin-left:auto}
.day-body{padding:6px 14px}
.mini-row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.mini-row:last-child{border-bottom:none}
.mini-row .mr-main{flex:1;min-width:0;font-size:13.5px}
.mini-row .mr-main b{font-weight:600}
.mini-row.done .mr-main{color:var(--ink3);text-decoration:line-through}

/* ============ timeline for events ============ */
.tl{display:grid;grid-template-columns:92px 1fr;gap:0;position:relative}
.tl .tl-time{font-size:12.5px;color:var(--ink2);padding:10px 12px 10px 0;text-align:right;font-variant-numeric:tabular-nums}
.tl .tl-dot{position:relative;padding:10px 0 10px 18px}
.tl .tl-dot::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--line2)}
.tl .tl-dot::after{content:"";position:absolute;left:0;top:16px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--card)}
.tl .tl-dot.u::after{background:var(--danger)}
.tl .tl-dot.s::after{background:var(--amber)}

/* ============ responsive ============ */
@media(max-width:920px){
  #nav{display:none}
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:60;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottomnav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;color:var(--ink2);font-size:11px;font-weight:600}
  #bottomnav .bn-item.active{color:var(--brand2);background:var(--brand-bg)}
  #main{padding:20px 16px 110px}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .coursegrid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .coursegrid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .page-head h1{font-size:22px}
  .tl{grid-template-columns:74px 1fr}
}

/* ============ print (笔记导出 PDF) ============ */
@media print{
  #nav,#bottomnav,.no-print{display:none!important}
  #main{padding:0;max-width:none}
  body{background:#fff}
  .card,.note-card,.day-block{box-shadow:none;border-color:#ddd;page-break-inside:avoid}
  .section-h h2{font-size:15px}
  body{font-size:13px}
}
</style>

<script>
"use strict";
/* =====================================================================

/* ---------------- 图标（内联 SVG） ---------------- */
var IC = {
  check:'<svg class="ck-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',

  book:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15.5H6.5A2.5 2.5 0 004 21V5.5z"/><path d="M4 18.5A2.5 2.5 0 016.5 16H20"/></svg>',
  quiz:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4H9z"/><path d="M7 3H4v18h16V3h-3"/><path d="M8.5 10.5h7M8.5 14h4.5"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>',
  dl:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5"/><path d="M4 19.5h16"/></svg>',
  ext:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4L10 14"/><path d="M19 13.5V19a1.5 1.5 0 01-1.5 1.5h-12A1.5 1.5 0 014 19V7a1.5 1.5 0 011.5-1.5H11"/></svg>',
  alert:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19L12 3.5z"/><path d="M12 10v4.5"/><path d="M12 17.5v.5"/></svg>',
  right:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  refresh:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 5v6h-6"/></svg>',
  trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/><path d="M10 11v5M14 11v5"/></svg>',
  spark:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>',
  cap:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5L12 4.5l9.5 5-9.5 5-9.5-5z"/><path d="M6.5 12v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V12"/><path d="M21.5 9.5V15"/></svg>',
  flag:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4.5"/><path d="M5 4.5h12l-2.5 4 2.5 4H5"/></svg>',
  clock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.8"/></svg>',

  archive:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16v12H4z"/><path d="M3 4.5h18V8H3z"/><path d="M10 12h4"/></svg>'
};
function setIc(id, name){ var el=document.getElementById(id); if(el) el.innerHTML=IC[name]; }
function ic(name){ return IC[name]||''; }
/* ---------------- 工具函数 ---------------- */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function escAttr(s){ return esc(s); }
function now(){ return new Date(); }
function unix(ms){ return Math.round(ms/1000); }
function fromUnix(u){ return u? new Date(u*1000):null; }
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtDate(d){ if(!d) return ''; return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDateCN(d){ if(!d) return ''; var wd=['日','一','二','三','四','五','六']; return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd[d.getDay()]; }
function fmtTime(d){ if(!d) return ''; return fmtDate(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDur(sec){ if(sec==null) return ''; sec=Math.round(sec); if(sec<=0) return '已过期'; var d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60); if(d>0)return d+'天'+(h>0?h+'小时':''); if(h>0)return h+'小时'+(m>0?m+'分':''); return (m>0?m+'分':'1分')+'内'; }
function relTime(u){ if(!u) return ''; var diff=Date.now()/1000-u; if(diff<0) return fmtDur(-diff)+'后'; if(diff<60) return '刚刚'; if(diff<3600) return Math.floor(diff/60)+'分钟前'; if(diff<86400) return Math.floor(diff/3600)+'小时前'; if(diff<604800) return Math.floor(diff/86400)+'天前'; return fmtDate(fromUnix(u)); }
function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function dayKey(d){ return fmtDate(d); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoWeek(d){ var x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()+3-((x.getDay()+6)%7)); var w1=new Date(x.getFullYear(),0,4); return x.getFullYear()+'-W'+pad2(1+Math.round(((x-w1)/86400000-3+((w1.getDay()+6)%7))/7)); }
function uid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function hashStr(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h.toString(36); }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._tm); toast._tm=setTimeout(function(){ t.classList.remove('show'); },2400); }
function download(name, content, mime){ var blob=new Blob([content],{type:mime||'application/octet-stream'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400); }
function mdEscape(s){ return String(s==null?'':s).replace(/\|/g,'\\|'); }
function stripHtml(s){ var d=document.createElement('div'); d.innerHTML=String(s||''); return d.textContent||''; }

/* ---------------- 数据存储 ---------------- */
var LS_KEY='mlh_assistant_v1';
var DB={ courses:[], assignments:[], events:[], announcements:[], posts:[], sections:[], submissions:{}, meta:{ updatedAt:0, source:'', lastReportWeek:'', lastReportAt:0, moodleBase:'https://scemoodle.hkbu.edu.hk', moodleToken:'', aiEnabled:false, aiBase:'https://api.deepseek.com/v1', aiKey:'', aiModel:'deepseek-chat', quizTotal:12, notes:{} } };
var CHECK={};   // taskId -> true
var QUIZLOG={}; // courseId -> [ {date, score, total, mode} ]
var NOTE_TXT={};// courseId -> { pointId -> {zh:'', en:'', ai:''} }

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({db:DB,check:CHECK,quiz:QUIZLOG,notes:NOTE_TXT})); }catch(e){ console.warn('save failed',e); } }
function load(){
  try{
    var raw=localStorage.getItem(LS_KEY); if(!raw) return;
    var o=JSON.parse(raw);
    if(o.db){ DB=Object.assign(DB, o.db); DB.meta=Object.assign(DB.meta, o.db.meta||{}); }
    if(o.check) CHECK=o.check;
    if(o.quiz) QUIZLOG=o.quiz;
    if(o.notes) NOTE_TXT=o.notes;
  }catch(e){ console.warn('load failed',e); }
}
function wipeAll(){ localStorage.removeItem(LS_KEY); location.reload(); }

/* 数据新鲜度 */
function freshLabel(){ var u=DB.meta.updatedAt; if(!u) return '尚无数据'; return '数据更新于 '+fmtTime(fromUnix(u))+(DB.meta.source?'（'+DB.meta.source+'）':''); }
function isFresh(){ return DB.meta.updatedAt>0; }
/* ---------------- 课程 & 事项模型 ---------------- */
function courseById(id){ for(var i=0;i<DB.courses.length;i++) if(String(DB.courses[i].id)===String(id)) return DB.courses[i]; return null; }
function assignmentsOf(cid){ return DB.assignments.filter(function(a){ return String(a.course_id)===String(cid); }); }
function eventsOf(cid){ return DB.events.filter(function(e){ return String(e.course_id)===String(cid); }); }
function announcementsOf(cid){ return DB.announcements.filter(function(a){ return String(a.course_id)===String(cid); }); }
function postsOf(cid){ return DB.posts.filter(function(p){ return String(p.course_id)===String(cid); }); }
function sectionsOf(cid){ return DB.sections.filter(function(s){ return String(s.course_id)===String(cid); }); }
function subStatus(aid){ var s=DB.submissions[String(aid)]; return s||null; }
function courseTagColor(cid){ var p=['#0E7A5F','#2C6E8F','#B45309','#7A5C2E','#8A5A44','#4A6B53','#556B7A','#7A6E5C']; var h=0; String(cid).split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; }); return p[h%p.length]; }
function courseShort(c){ if(!c) return '?'; var n=c.shortname||c.fullname||'课'; return n.replace(/\s+/g,' ').slice(0,2).toUpperCase(); }

/* ---------------- 打钩记忆 ---------------- */
function taskIdOf(kind,id){ return kind+':'+String(id); }
function isDone(kind,id){ return !!CHECK[taskIdOf(kind,id)]; }
function toggleTask(kind,id){ var k=taskIdOf(kind,id); if(CHECK[k]){ delete CHECK[k]; } else { CHECK[k]=Date.now()/1000; } save(); rerender(); }
function doneCount(){ var n=0; for(var k in CHECK) n++; return n; }

/* ---------------- 学习计划引擎 ---------------- */
function openAssignments(){ return DB.assignments.filter(function(a){ return a.duedate && a.duedate>=Date.now()/1000 && !isDone('assign',a.id); }); }
function urgentEvents(days){ var nowU=Date.now()/1000; var lim=nowU+days*86400; return DB.events.filter(function(e){ return e.timestart && e.timestart>=nowU-86400 && e.timestart<=lim && !isDone('event',e.id) && e.type!=='assign'; }); }
function unreadAnnouncements(){ return DB.announcements.filter(function(a){ return !isDone('ann',a.id); }); }
function unsubmittedDueSoon(days){ var nowU=Date.now()/1000; var lim=nowU+days*86400; return DB.assignments.filter(function(a){ var st=subStatus(a.id); var bad=!st || st.status==='not_submitted' || (!st.status && !st.submitted); return a.duedate && a.duedate>nowU-86400 && a.duedate<=lim && bad && !isDone('assign',a.id); }); }

/* 本周（7 天）紧要事项：作业截止 + 考试/事件 + 未读公告 + 未交作业 */
function weekUrgent(){
  var nowU=Date.now()/1000, lim=nowU+7*86400;
  var out=[];
  DB.assignments.forEach(function(a){
    if(!a.duedate) return;
    var st=subStatus(a.id); var submitted= st? (st.submitted||st.status==='submitted'||st.status==='graded') : false;
    var over= a.duedate<nowU && !isDone('assign',a.id) && !submitted;
    if(isDone('assign',a.id)) return;
    if((a.duedate<=lim && a.duedate>=nowU-86400) || over){
      out.push({kind:'assign', item:a, course:courseById(a.course_id), overdue:over, submitted:submitted});
    }
  });
  urgentEvents(7).forEach(function(e){ out.push({kind:'event', item:e, course:courseById(e.course_id), overdue:false}); });
  unreadAnnouncements().forEach(function(a){ out.push({kind:'ann', item:a, course:courseById(a.course_id)}); });
  out.sort(function(x,y){
    var a=x.kind==='assign'?x.item.duedate:(x.kind==='event'?x.item.timestart:9e15);
    var b=y.kind==='assign'?y.item.duedate:(y.kind==='event'?y.item.timestart:9e15);
    return a-b;
  });
  return out;
}

/* 每日计划：把未完成事项排进未来 7 天 */
function buildPlan(){
  var today=startOfDay(now());
  var days=[]; for(var i=0;i<7;i++) days.push({date:addDays(today,i), tasks:[]});
  var nowU=Date.now()/1000;
  var items=openAssignments().map(function(a){ return {kind:'assign',item:a,course:courseById(a.course_id),due:a.duedate}; });
  urgentEvents(14).forEach(function(e){ items.push({kind:'event',item:e,course:courseById(e.course_id),due:e.timestart}); });
  items.sort(function(a,b){ return a.due-b.due; });
  items.forEach(function(t){
    var daysLeft=Math.ceil((t.due-nowU)/86400);
    var idx=0;
    if(daysLeft<=1) idx=0;
    else if(daysLeft<=3) idx=1;
    else if(daysLeft<=5) idx=Math.min(2,Math.floor(daysLeft/2));
    else idx=Math.min(6,Math.max(3,daysLeft-3));
    if(days[idx].tasks.length<4 || idx===0){ days[idx].tasks.push(t); }
    else { for(var j=idx+1;j<7;j++){ if(days[j].tasks.length<4){ days[j].tasks.push(t); return; } } days[6].tasks.push(t); }
  });
  /* 每门有考试/作业的课，穿插复习与小测 */
  var courseIds={}; items.forEach(function(t){ courseIds[t.course?t.course.id:'x']=1; });
  Object.keys(courseIds).forEach(function(cid){
    if(courseById(cid)) days[0].tasks.push({kind:'review',course:courseById(cid),due:0});
  });
  return days;
}

/* 每周周报 */
function buildReport(){
  var nowU=Date.now()/1000;
  var urgent=weekUrgent();
  var doneThisWeek=0; Object.keys(CHECK).forEach(function(k){ if(CHECK[k]>nowU-7*86400) doneThisWeek++; });
  var unsub=unsubmittedDueSoon(7);
  var news=unreadAnnouncements();
  var assignDue=urgent.filter(function(u){return u.kind==='assign';});
  var subOk=DB.assignments.filter(function(a){ var st=subStatus(a.id); return st && (st.submitted||st.status==='submitted'||st.status==='graded'); });
  return { generatedAt:nowU, urgent:urgent, doneThisWeek:doneThisWeek, unsub:unsub, news:news, assignDue:assignDue, subOk:subOk,
    overdue:assignDue.filter(function(u){return u.overdue;}), pending:assignDue.filter(function(u){return !u.overdue;}) };
}

/* 考点：课程小节与模块（用于笔记与小测） */
function pointsOf(cid){
  var sects=sectionsOf(cid); var pts=[];
  sects.forEach(function(s){
    var mods=(s.modules||[]).filter(function(m){ return m && m.name && !/^$/.test(m.name); });
    if(s.name || mods.length){
      pts.push({id:'sec'+String(s.id||s.section), title:s.name||'（未命名小节）', mods:mods, section:s});
    }
  });
  if(!pts.length){
    var title=(courseById(cid)||{}).fullname||'本课程';
    pts.push({id:'sec0', title:title, mods:[], section:null});
  }
  return pts;
}
function pointWeight(pt){ return 1 + (pt.mods?pt.mods.length:0)*0.6; }
function pointTotalWeight(cid){ var ps=pointsOf(cid); var w=0; ps.forEach(function(p){ w+=pointWeight(p); }); return w||1; }
/* ---------------- 渲染公共 ---------------- */
function pageHead(kicker,title,sub,actions){
  return '<div class="page-head"><div class="kicker">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+(actions?'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+actions+'</div>':'')+'</div>';
}
function emptyBox(title,sub){ return '<div class="empty"><b>'+esc(title||'')+'</b>'+esc(sub||'')+'</div>'; }
function chipRow(kind,val,extra){
  var cls={urgent:'urgent',soon:'soon',ok:'ok',info:'info',neutral:'neutral',brand:'brand'}[kind]||'neutral';
  return '<span class="chip '+cls+'">'+(extra||'')+esc(val)+'</span>';
}
function checkBtn(kind,id){
  var on=isDone(kind,id);
  return '<button class="check'+(on?' on':'')+'" data-act="check" data-kind="'+kind+'" data-id="'+escAttr(id)+'" aria-label="完成">'+ic('check')+'</button>';
}
function linkOut(url,txt){ return url?'<a class="linkout" href="'+escAttr(url)+'" target="_blank" rel="noopener">'+esc(txt||'打开')+ic('ext')+'</a>':''; }

function renderNav(){

    var evc=ev.filter(function(e){return e.timestart>=Date.now()/1000-86400 && e.timestart<=Date.now()/1000+7*86400 && e.type!=='assign' && !isDone('event',e.id);}).length;

function aiReady(){ return DB.meta.aiEnabled && DB.meta.aiKey && DB.meta.aiBase; }
function aiFetch(messages, maxTokens){
  var url=DB.meta.aiBase.replace(/\/+$/,'')+'/chat/completions';
  return fetch(url,{ method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+DB.meta.aiKey},
    body:JSON.stringify({model:DB.meta.aiModel||'deepseek-chat',messages:messages,temperature:0.4,max_tokens:maxTokens||1800})
  }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('AI 请求失败 ('+r.status+'): '+t.slice(0,200)); }); return r.json(); })
  .then(function(j){ var c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''; return c; });
}

var QUIZ_STATE=null; /* {mode, questions, i, answers, courseId} */

function basicQuestions(cid){
  var pts=pointsOf(cid);
  var allMods=[]; pts.forEach(function(p){ (p.mods||[]).forEach(function(m){ allMods.push({point:p.id, m:m}); }); });
  var qs=[];
  pts.forEach(function(p){
    var mods=p.mods||[];
    var w=pointWeight(p);
    var n=Math.max(1, Math.round(2*w));
    for(var i=0;i<n;i++){
      if(mods.length>=1 && allMods.length>=4){
        var ans=mods[i%mods.length];
        var dists=[];
        allMods.forEach(function(x){ if(x.point!==p.id && dists.length<3 && x.m.name!==ans.name) dists.push(x.m.name); });
        if(dists.length<2){ qs.push({point:p.title, type:'自评', stem:'你能回忆出「'+p.title+'」的核心内容吗？', opts:['能，可以顺利回忆','记得一部分','完全没印象'], ans:0, explain:'复习时可以打开笔记逐条对照。'}); }
        else {
          var opts=dists.slice(0,3); opts.splice(Math.floor(Math.random()*(opts.length+1)),0,ans.name);
          qs.push({point:p.title, type:'单选', stem:'以下哪一项属于考点「'+p.title+'」的学习材料？', opts:opts, ans:opts.indexOf(ans.name), explain:'正确答案：'+ans.name+'（'+p.title+' 下的模块）。'});
        }
      } else {
        qs.push({point:p.title, type:'自评', stem:'你能回忆出「'+p.title+'」的核心内容吗？', opts:['能，可以顺利回忆','记得一部分','完全没印象'], ans:0, explain:'复习时可以打开笔记逐条对照。'});
      }
    }
  });
  return qs;
}

function aiQuestions(cid, total){
  var c=courseById(cid); var pts=pointsOf(cid);
  var ptsJ=pts.map(function(p){ return {point:p.title, desc:p.desc||'', modules:(p.mods||[]).slice(0,15).map(function(m){return m.name;})}; });
  var totalW=pointTotalWeight(cid);
  var dist=pts.map(function(p){ return Math.max(1, Math.round(total*pointWeight(p)/totalW)); });
  var sum=0; dist.forEach(function(n){sum+=n;}); while(sum>total){ var mx=0; for(var i=1;i<dist.length;i++) if(dist[i]>dist[mx]) mx=i; dist[mx]--; sum--; }
  return aiFetch([{role:'system',content:'你是大学课程出题老师。根据考点出题，题型只可用：单选、多选、判断、填空。题目覆盖全部考点，每个考点的题目数量按该考点内容量比例分配（具体数量见用户输入）。'+
    '输出严格 JSON 数组，不要任何其他文字，格式：[{"point":"考点名","type":"单选|多选|判断|填空","question":"题目","options":["A. ...","B. ..."]或[]（判断题给["正确","错误"]，填空给[]）,"answer":"正确答案（填空为答案文本）","explain":"解析"}]'},
    {role:'user',content:'课程：'+c.fullname+'（'+c.shortname+'）\n考点列表：'+JSON.stringify(ptsJ)+'\n每考点题目数量：'+JSON.stringify(dist)+'（总量 '+total+' 题）'}], 4000)
  .then(function(txt){
    var t=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
    var m=t.match(/\[[\s\S]*\]/); if(m) t=m[0];
    var arr=JSON.parse(t);
    if(!Array.isArray(arr)||!arr.length) throw new Error('格式错误');
    return arr.map(function(q,i){ return {point:q.point||'考点', type:q.type||'单选', stem:q.question, opts:q.options||[], ans:(q.type==='填空'? -2 : (q.type==='判断'? (String(q.answer).trim()==='正确'?0:1) : q.options.indexOf(q.answer))), explain:q.explain||'', answerText:(q.type==='填空'?q.answer:null), ai:true}; });
  });
}

function quizRender(cid){
  var q=QUIZ_STATE, idx=q.i, cur=q.questions[idx];
  var bar=Math.round(idx/q.questions.length*100);
  var h='<div class="q-bar"><i style="width:'+bar+'%"></i></div>';
  if(!cur){ /* 结果页 */
    var score=0; q.answers.forEach(function(a){ if(a===null) return; score+= (a===cur? 0:0); });
    /* 重新计算 */
    score=0;
    for(var k=0;k<q.questions.length;k++){ var a=q.answers[k]; if(a==null) continue; var ok=(q.questions[k].ans===-2)? false : (a===q.questions[k].ans); if(ok) score+=1; else if(q.questions[k].type==='自评' && a===1) score+=0.5; }
    var pct=Math.round(score/q.questions.length*100);
    var log=(QUIZLOG[cid]||[]); log.push({date:Date.now()/1000, score:score, total:q.questions.length, mode:q.mode}); QUIZLOG[cid]=log; save();
    var wrong=q.questions.filter(function(x,i){ var a=q.answers[i]; if(a==null) return false; if(x.ans===-2) return false; return a!==x.ans; });
    h+='<div class="q-result"><div class="score">'+pct+'<small>%</small></div><div style="color:var(--ink2);margin:6px 0 14px">'+score+' / '+q.questions.length+' 题正确'+(q.mode==='ai'?' · AI 出题':' · 基础自测')+'</div>'
      +'<div style="display:flex;gap:8px;justify-content:center"><button class="btn primary" data-act="restart-quiz" data-id="'+escAttr(cid)+'">'+ic('refresh')+'再来一次</button><button class="btn ghost" data-act="quiz-home" data-id="'+escAttr(cid)+'">返回小测页</button></div></div>';
    if(wrong.length){ h+='<div class="card" style="margin-top:16px"><div class="section-h"><h2>错题回顾</h2></div>'+wrong.map(function(x,i){
      return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="q-point">'+esc(x.point)+'</div><div style="font-weight:600">'+esc(x.stem)+'</div><div class="q-answer" style="margin-top:6px">'+ic('checkCol')+' 正确答案：<b>'+esc(x.ans===-2?(x.answerText||''):(x.opts[x.ans]||''))+'</b>'+(x.explain?'<br>'+esc(x.explain):'')+'</div></div>';
    }).join('')+'</div>'; }
    return h;
  }
  h+='<div class="q-card"><div class="q-point">'+esc(cur.point)+' · '+esc(cur.type)+'</div><div class="q-stem">'+(idx+1)+'. '+esc(cur.stem)+'</div>';
  h+='<div class="q-opts">'+cur.opts.map(function(o,i){
    return '<button class="q-opt" data-act="q-opt" data-i="'+i+'"><span class="qk">'+(i+1)+'</span><span>'+esc(o)+'</span></button>';
  }).join('')+'</div></div>';

/* ---------------- 快照规范化（导入） ---------------- */
function normalizeSnapshot(o){
  var d={ courses:o.courses||[], assignments:o.assignments||[], events:o.events||[], announcements:o.announcements||[], posts:o.posts||[], sections:o.sections||[], submissions:o.submissions||{}, meta:{} };
  d.courses.forEach(function(c){ c.id=String(c.id); if(!c.fullname&&c.name) c.fullname=c.name; });
  ['assignments','events'].forEach(function(k){ d[k].forEach(function(x){ if(!x.id) x.id=uid(); if(x.course_id!=null) x.course_id=String(x.course_id); }); });
  d.announcements.forEach(function(x){ if(!x.id) x.id=uid(); if(x.course_id!=null) x.course_id=String(x.course_id); });
  d.posts.forEach(function(x){ if(!x.id) x.id=uid(); if(x.course_id!=null) x.course_id=String(x.course_id); });
  d.sections.forEach(function(x){ if(x.course_id!=null) x.course_id=String(x.course_id); });
  return d;
}
function applySnapshot(d, srcLabel){
  var nd=normalizeSnapshot(d);
  DB.courses=nd.courses; DB.assignments=nd.assignments; DB.events=nd.events; DB.announcements=nd.announcements; DB.posts=nd.posts; DB.sections=nd.sections; DB.submissions=nd.submissions;
  DB.meta.updatedAt=Date.now()/1000; DB.meta.source=srcLabel; DB.meta.lastReportWeek=''; DB.meta.lastReportAt=0;
  /* 清理已失效的勾选 */
  var valid={};
  function key(kind,id){ return kind+':'+String(id); }
  DB.assignments.forEach(function(a){ valid[key('assign',a.id)]=1; });
  DB.events.forEach(function(e){ valid[key('event',e.id)]=1; });
  DB.announcements.forEach(function(a){ valid[key('ann',a.id)]=1; });
  Object.keys(CHECK).forEach(function(k){ if(!valid[k]) delete CHECK[k]; });
  save();
}

function importSnapshotJson(text){
  var o=JSON.parse(text);
  if(o.format && o.format.indexOf('moodle-assistant')>=0) return applySnapshot(o,'Moodle 快照');
  if(o.courses && o.assignments) return applySnapshot(o,'数据导入');
  if(o.db && (o.check!==undefined||o.quiz!==undefined||o.notes!==undefined)){
    DB=o.db; CHECK=o.check||{}; QUIZLOG=o.quiz||[]; NOTE_TXT=o.notes||''; save(); return;
  }
  throw new Error('无法识别的数据格式');
}

/* ---------------- Moodle REST（wstoken 直连，可选） ---------------- */
function moodleCall(ws, params){
  var base=(DB.meta.moodleBase||'https://scemoodle.hkbu.edu.hk').replace(/\/+$/,'');
  var qs='wstoken='+encodeURIComponent(DB.meta.moodleToken)+'&moodlewsrestformat=json&wsfunction='+encodeURIComponent(ws);
  Object.keys(params||{}).forEach(function(k){ var v=params[k]; if(Array.isArray(v)) v.forEach(function(x){ qs+='&'+encodeURIComponent(k)+'[]='+encodeURIComponent(x); }); else qs+='&'+encodeURIComponent(k)+'='+encodeURIComponent(v); });
  return fetch(base+'/webservice/rest/server.php?'+qs).then(function(r){ return r.json(); }).then(function(j){ if(j.exception) throw new Error(j.message||'接口错误'); return j; });
}

      var courses=(cs.courses||cs).map(function(c){ return {id:String(c.id), fullname:c.fullname, shortname:c.shortname, url:(DB.meta.moodleBase||'').replace(/\/+$/,'')+'/course/view.php?id='+c.id}; });
      var ids=courses.map(function(c){return c.id;});
      if(!ids.length) return {courses:courses, assignments:[], events:[], announcements:[], posts:[], sections:[], submissions:{}};
      return moodleCall('mod_assign_get_assignments',{courseids:ids}).then(function(a){
        var assignments=[], submissions={}, aIds=[];
        (a.courses||[]).forEach(function(c){
          (c.assignments||[]).forEach(function(x){
            assignments.push({id:String(x.id), course_id:String(x.course), name:x.name, duedate:x.duedate, url:(DB.meta.moodleBase||'').replace(/\/+$/,'')+'/mod/assign/view.php?id='+x.id, intro:stripHtml(x.intro||'')});
            aIds.push(String(x.id));
          });
        });

          var st=s.lastattempt? s.lastattempt.submission? 'submitted':'not_submitted' : (s.submissionstatus||'unknown');
          var gr=s.lastattempt&&s.lastattempt.grading? s.lastattempt.grading:null;
          submissions[aid]={status:st, submitted:st==='submitted', graded:!!gr, grade:gr&&gr.grade?String(gr.grade):''};
        }).catch(function(){ return null; }); });
        return Promise.all(subQ).then(function(){ return {courses:courses, assignments:assignments, submissions:submissions}; });
      });
    }).then(function(part){
      var ids=part.courses.map(function(c){return c.id;});
      var evP= moodleCall('core_calendar_get_action_events_by_timesort',{timesort:Math.floor(Date.now()/1000)-86400,limitnum:200}).then(function(ev){
        return (ev.events||[]).map(function(e){ return {id:'ev'+e.id, course_id:e.course?String(e.course.id):'', name:e.name, timestart:e.timestart, type:e.eventtype||'event', url:e.url||''}; });
      });
      var secP=Promise.all(ids.map(function(cid){ return moodleCall('core_course_get_contents',{courseid:cid}).then(function(sects){
        return sects.map(function(s){ return {course_id:String(cid), section:s.id, name:s.name||'', modules:(s.modules||[]).map(function(m){ return {id:String(m.id), name:m.name||'', modname:m.modname||m.module||'', url:m.url||''}; }).filter(function(m){return m.name;})}; });
      }).catch(function(){ return []; }); })).then(function(ss){ return [].concat.apply([],ss); });
      return Promise.all([evP,secP]).then(function(r){ part.events=r[0]; part.sections=r[1]; part.announcements=[]; part.posts=[]; return part; });
    });
  }).then(function(part){
    applySnapshot(part,'Moodle 令牌直连');
  });
}

/* ---------------- 答题流程（反馈式） ---------------- */
function quizAnswer(cid, optIdx){
  var q=QUIZ_STATE, cur=q.questions[q.i];
  if(q.answers[q.i]!=null) return;
  var correct=(cur.ans===-2)?null:(optIdx===cur.ans);
  q.answers[q.i]=optIdx;
  q.fb={idx:q.i, optIdx:optIdx, correct:correct, explain:cur.explain||'', ansTxt:(cur.ans===-2?(cur.answerText||''):(cur.opts[cur.ans]||'')), type:cur.type};
  save(); rerender();
}
function quizNext(cid){ var q=QUIZ_STATE; q.i++; q.fb=null; save(); rerender(); }

/* 重写 quizRender：带逐题反馈 */
function quizRender(cid){
  var q=QUIZ_STATE;
  if(q.i>=q.questions.length){ return quizResultHtml(cid); }
  var cur=q.questions[q.i];
  var bar=Math.round(q.i/q.questions.length*100);
  var h='<div class="q-bar"><i style="width:'+bar+'%"></i></div>';
  var fb=q.fb;
  h+='<div class="q-card"><div class="q-point">'+esc(cur.point)+' · '+esc(cur.type)+' · 第 '+(q.i+1)+' / '+q.questions.length+' 题</div><div class="q-stem">'+esc(cur.stem)+'</div>';
  if(cur.type==='填空'){
    h+='<div class="field" style="margin:10px 0"><input id="qFill" placeholder="输入你的答案" '+(fb?'disabled value="'+escAttr(q.answers[q.i]===null?'':q.answers[q.i])+'"':'')+'></div>';
    if(fb){ h+='<div class="q-answer">'+ic('checkCol')+' 参考答案：<b>'+esc(fb.ansTxt)+'</b>（请自行对照）'+(fb.explain?'<br>'+esc(fb.explain):'')+'</div>'; }
  } else {
    h+='<div class="q-opts">'+cur.opts.map(function(o,i){
      var cls='';
      if(fb){ if(i===fb.optIdx) cls= fb.correct? ' correct':' wrong'; else if(i===cur.ans) cls=' correct'; }
      else if(q.answers[q.i]!=null && i===q.answers[q.i]) cls=' sel';
      return '<button class="q-opt'+cls+'" data-act="q-opt" data-i="'+i+'"'+(fb?' disabled':'')+'><span class="qk">'+(i+1)+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
    if(fb){ h+='<div class="q-answer">'+(fb.correct?'<b style="color:var(--ok)">回答正确</b>':'<b style="color:var(--danger)">回答错误</b>')+' · 正确答案：<b>'+esc(fb.ansTxt)+'</b>'+(fb.explain?'<br>'+esc(fb.explain):'')+'</div>'; }
  }
  h+='</div>';
  if(fb){ h+='<div style="text-align:right"><button class="btn primary" data-act="q-next">下一题 '+ic('right')+'</button></div>'; }
  else if(cur.type==='填空'){ h+='<div style="text-align:right"><button class="btn primary" data-act="q-fill">提交答案</button></div>'; }
  return h;
}
function quizResultHtml(cid){
  var q=QUIZ_STATE; var score=0;
  for(var k=0;k<q.questions.length;k++){ var a=q.answers[k]; if(a==null) continue; var qq=q.questions[k];
    if(qq.ans===-2){ score+=0; continue; } if(a===qq.ans) score+=1; else if(qq.type==='自评' && a===1) score+=0.5; }
  var pct=Math.round(score/q.questions.length*100);
  var log=(QUIZLOG[cid]||[]); log.push({date:Date.now()/1000, score:score, total:q.questions.length, mode:q.mode}); QUIZLOG[cid]=log; save();
  var h='<div class="q-result"><div class="score">'+pct+'<small>%</small></div>'
    +'<div style="color:var(--ink2);margin:6px 0 14px">'+score+' / '+q.questions.length+' 题'+(q.mode==='ai'?' · AI 出题':' · 基础自测')+'</div>'
    +'<div style="display:flex;gap:8px;justify-content:center"><button class="btn primary" data-act="restart-quiz" data-id="'+escAttr(cid)+'">'+ic('refresh')+'再来一次</button><button class="btn ghost" data-act="quiz-home" data-id="'+escAttr(cid)+'">返回小测页</button></div></div>';
  var wrong=[];
  for(var i=0;i<q.questions.length;i++){ var a=q.answers[i]; if(a==null||q.questions[i].ans===-2) continue; if(a!==q.questions[i].ans) wrong.push(i); }
  if(wrong.length){ h+='<div class="card" style="margin-top:16px"><div class="section-h"><h2>错题回顾</h2></div>'+wrong.map(function(idx){ var x=q.questions[idx];
    return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="q-point">'+esc(x.point)+'</div><div style="font-weight:600">'+esc(x.stem)+'</div><div class="q-answer" style="margin-top:6px">'+ic('checkCol')+' 正确答案：<b>'+esc(x.ans===-2?(x.answerText||''):(x.opts[x.ans]||''))+'</b>'+(x.explain?'<br>'+esc(x.explain):'')+'</div></div>';
  }).join('')+'</div>'; }
  return h;
}

  var parts=hash.split('/'); var view=parts[1]||'today'; var id=parts[2]||'';

  if(view==='today') main.innerHTML=viewToday();
  else if(view==='courses') main.innerHTML=viewCourses();
  else if(view==='course') main.innerHTML=viewCourse(id);
  else if(view==='notes') main.innerHTML=viewNotes(id);
  else if(view==='quiz') main.innerHTML=viewQuiz(id);
  else if(view==='settings') main.innerHTML=viewSettings();
  else { location.hash='#/today'; return; }
  renderNav();
  window.scrollTo(0,0);
}
function rerender(){ route(); }

/* ---------------- 全局事件 ---------------- */
document.addEventListener('click', function(e){
  var t=e.target;
  var actEl=t.closest? t.closest('[data-act]'):null;
  var clickEl=t.closest? t.closest('[data-click]'):null;
  if(clickEl){ e.preventDefault();
    var cid=clickEl.getAttribute('data-id');
    var kind=clickEl.getAttribute('data-click');
    if(kind==='course') location.hash='#/course/'+cid;
    else if(kind==='note') location.hash='#/notes/'+cid;
    else if(kind==='quiz') location.hash='#/quiz/'+cid;
    return;
  }
  if(actEl){ var act=actEl.getAttribute('data-act'); handleAct(act, actEl, e); return; }
  var tabEl=t.closest? t.closest('.tab'):null;
  if(tabEl){ var name=tabEl.getAttribute('data-tab');
    $all('.tab').forEach(function(x){ x.classList.toggle('active', x===tabEl); });
    ['tasks','ann','posts','plan'].forEach(function(k){ var el=document.getElementById('tab-'+k); if(el) el.style.display=(k===name?'':'none'); });
    return;
  }
});
document.addEventListener('change', function(e){
  var t=e.target;
  if(t && t.getAttribute&&t.getAttribute('data-act')==='import-file' && t.files && t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){ try{ importSnapshotJson(String(fr.result)); toast('导入成功：'+DB.courses.length+' 门课程'); rerender(); }catch(err){ toast('导入失败：'+err.message); } };
    fr.readAsText(t.files[0]);
    t.value='';
  }
});

function handleAct(act, el, ev){
  ev && ev.preventDefault();
  var id=el.getAttribute('data-id')||'';
  var cid=el.getAttribute('data-cid')||'';
  var pid=el.getAttribute('data-pid')||'';
  var kind=el.getAttribute('data-kind')||'';
  switch(act){
    case 'check': toggleTask(kind, id); break;
    case 'genreport': toast('周报已重新生成'); rerender(); break;
    case 'print': window.print(); break;
    case 'export-notes': exportNotesMd(id); break;
    case 'ai-note': runAiNote(cid, pid); break;
    case 'toggle-note': modalNoteEditor(cid, pid); break;
    case 'note-save': {
      var en=document.getElementById('mne')?document.getElementById('mne').value:''; var zh=document.getElementById('mnz')?document.getElementById('mnz').value:'';
      if(!NOTE_TXT[cid]) NOTE_TXT[cid]={}; var nt=NOTE_TXT[cid][pid]||{zh:'',en:'',ai:''}; nt.en=en; nt.zh=zh; NOTE_TXT[cid][pid]=nt; save(); closeModal(); rerender(); toast('笔记已保存'); break; }
    case 'modal-close': closeModal(); break;
    case 'start-quiz': startQuiz(el); break;
    case 'restart-quiz': { if(QUIZ_STATE){ QUIZ_STATE.i=0; QUIZ_STATE.answers=QUIZ_STATE.questions.map(function(){return null;}); QUIZ_STATE.fb=null; } save(); rerender(); break; }
    case 'quiz-home': QUIZ_STATE=null; rerender(); break;
    case 'q-opt': quizAnswer(id, parseInt(el.getAttribute('data-i'),10)); break;
    case 'q-next': quizNext(id); break;
    case 'q-fill': {
      var val=document.getElementById('qFill')?document.getElementById('qFill').value.trim():'';
      var q=QUIZ_STATE, cur=q.questions[q.i]; if(!val){ toast('先输入答案'); return; }
      q.answers[q.i]=val; q.fb={idx:q.i, optIdx:-1, correct:null, explain:cur.explain||'', ansTxt:cur.answerText||'', type:'填空'}; save(); rerender(); break; }
    case 'import-paste': openModal('<h3>粘贴快照 JSON</h3><div class="field"><textarea id="impText" style="min-height:160px" placeholder="把 moodle_snapshot_*.json 的内容粘贴到这里"></textarea></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-act="modal-close">取消</button><button class="btn primary" data-act="save-import">导入</button></div>'); break;
    case 'import-url': openModal('<h3>从链接导入数据</h3><div class="field"><label>数据文件链接</label><input id="impUrl" placeholder="粘贴 GitHub raw 链接或其他 JSON 直链"></div><div style="font-size:12px;color:#888;margin:8px 0">把导出的 JSON 上传到 GitHub，点 Raw 按钮复制链接贴到这里</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-act="modal-close">取消</button><button class="btn primary" data-act="save-import-url">导入</button></div>'); break;
    case 'save-import-url': { var u=document.getElementById('impUrl')?document.getElementById('impUrl').value.trim():''; if(!u){ toast('先粘贴链接'); break; } toast('正在下载…'); fetch(u).then(function(r){return r.text();}).then(function(t){ importSnapshotJson(t); toast('导入成功：'+DB.courses.length+' 门课程'); closeModal(); rerender(); }).catch(function(e){ toast('下载失败：'+e.message); }); break; }
    case 'save-import': {
      var txt=document.getElementById('impText')?document.getElementById('impText').value:'';
      try{ importSnapshotJson(txt); toast('导入成功：'+DB.courses.length+' 门课程'); closeModal(); rerender(); }catch(err){ toast('导入失败：'+err.message); } break; }
    case 'save-token': {
      DB.meta.moodleBase=(document.getElementById('setBase')?document.getElementById('setBase').value:'').trim()||'https://scemoodle.hkbu.edu.hk';
      DB.meta.moodleToken=(document.getElementById('setToken')?document.getElementById('setToken').value:'').trim();
      save();
      if(!DB.meta.moodleToken){ toast('请先填写令牌'); break; }
      toast('正在测试连接…');
      moodleCall('core_webservice_get_site_info',{}).then(function(info){ toast('连接成功：'+(info.fullname||'有效令牌')); save(); }).catch(function(err){ toast('连接失败：'+err.message); });
      break; }
    case 'pull-moodle': toast('正在拉取 Moodle 数据…'); moodlePullAll().then(function(){ toast('拉取完成'); rerender(); }).catch(function(err){ toast('拉取失败：'+err.message); }); break;
    case 'add-course': modalAddCourse(); break;
    case 'add-assign': modalAddAssign(); break;
    case 'add-event': modalAddEvent(); break;
    case 'save-course': {
      var nm=document.getElementById('acName')?document.getElementById('acName').value.trim():'';
      if(!nm){ toast('请输入课程名称'); break; }
      DB.courses.push({id:uid(), fullname:nm, shortname:(document.getElementById('acShort')?document.getElementById('acShort').value.trim():'')||'', url:(document.getElementById('acUrl')?document.getElementById('acUrl').value.trim():'')||''});
      DB.meta.updatedAt=Date.now()/1000; save(); closeModal(); rerender(); toast('课程已添加'); break; }
    case 'save-assign': {
      var csel=document.getElementById('aaCourse'); var cid2=csel?csel.value:'';
      var nm2=document.getElementById('aaName')?document.getElementById('aaName').value.trim():'';
      if(!cid2||!nm2){ toast('请选择课程并填写名称'); break; }
      var due=document.getElementById('aaDue')?document.getElementById('aaDue').value:'';
      DB.assignments.push({id:uid(), course_id:cid2, name:nm2, duedate:due?Math.floor(new Date(due).getTime()/1000):null, url:(document.getElementById('aaUrl')?document.getElementById('aaUrl').value.trim():'')||'', intro:''});
      DB.meta.updatedAt=Date.now()/1000; save(); closeModal(); rerender(); toast('作业已添加'); break; }
    case 'save-event': {
      var csel2=document.getElementById('aeCourse'); var cid3=csel2?csel2.value:'';
      var nm3=document.getElementById('aeName')?document.getElementById('aeName').value.trim():'';
      if(!cid3||!nm3){ toast('请选择课程并填写名称'); break; }
      var tt=document.getElementById('aeTime')?document.getElementById('aeTime').value:'';
      DB.events.push({id:uid(), course_id:cid3, name:nm3, timestart:tt?Math.floor(new Date(tt).getTime()/1000):null, type:'event', url:''});
      DB.meta.updatedAt=Date.now()/1000; save(); closeModal(); rerender(); toast('事件已添加'); break; }
    case 'export-data': download('moodle_assistant_data.json', JSON.stringify({db:DB,check:CHECK,quiz:QUIZLOG,notes:NOTE_TXT},null,1), 'application/json'); toast('数据已导出'); break;
    case 'wipe': confirmBox('将删除本设备上的全部课程数据、勾选记录与 AI 设置（不可恢复）。','wipe-do'); break;
    case 'wipe-do': closeModal(); wipeAll(); break;
    case 'copy-snap': {
      var ta=document.getElementById('snapCode'); if(!ta) break;
      ta.select(); ta.setSelectionRange(0,99999);
      try{ document.execCommand('copy'); toast('代码已复制，去 Moodle 控制台粘贴'); }
      catch(err){ if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast('代码已复制'); }); else toast('复制失败，请手动选择复制'); }
      break; }
    case 'download-snap': download('moodle抓取工具.html', buildSnapPage(), 'text/html;charset=utf-8'); toast('抓取工具页已下载'); break;
    case 'save-ai': {
      DB.meta.aiEnabled=(document.getElementById('aiOn')?document.getElementById('aiOn').value:'0')==='1';
      DB.meta.aiBase=(document.getElementById('aiBase')?document.getElementById('aiBase').value:'').trim();
      DB.meta.aiModel=(document.getElementById('aiModel')?document.getElementById('aiModel').value:'').trim()||'deepseek-chat';
      DB.meta.aiKey=(document.getElementById('aiKey')?document.getElementById('aiKey').value:'').trim();
      DB.meta.quizTotal=parseInt((document.getElementById('aiTotal')?document.getElementById('aiTotal').value:'12'),10)||12;
      save(); toast('AI 设置已保存'); rerender(); break; }
    case 'test-ai': {
      if(!aiReady()){ toast('请先保存 AI 设置'); break; }
      toast('正在测试 AI 连接…');
      aiFetch([{role:'user',content:'回复“连接成功”四个字'}], 50).then(function(t){ toast(t.slice(0,40)); }).catch(function(err){ toast('AI 测试失败：'+err.message); });
      break; }
  }
}

function runAiNote(cid, pid){
  if(!aiReady()){ toast('请先在设置中开启并保存 AI 引擎'); return; }
  var c=courseById(cid); var pt=pointsOf(cid).find(function(p){return p.id===pid;});
  if(!pt) return;
  toast('AI 正在精翻笔记…');
  aiNotes(pt, c).then(function(txt){
    if(!NOTE_TXT[cid]) NOTE_TXT[cid]={}; var nt=NOTE_TXT[cid][pid]||{zh:'',en:'',ai:''}; nt.ai=txt; NOTE_TXT[cid][pid]=nt;
    save(); toast('笔记已生成'); rerender();
  }).catch(function(err){ toast('AI 生成失败：'+err.message); });
}

function startQuiz(el){
  var cid=el.getAttribute('data-id');
  var modeEl=document.getElementById('qMode'); var mode=modeEl?modeEl.value:'basic';
  var totalEl=document.getElementById('qTotal'); var total=parseInt(totalEl?totalEl.value:'12',10)||12;
  var c=courseById(cid); if(!c) return;
  if(mode==='ai' && aiReady()){
    toast('AI 出题中，请稍候…');
    aiQuestions(cid, total).then(function(qs){
      QUIZ_STATE={mode:'ai', questions:qs, i:0, answers:qs.map(function(){return null;}), fb:null, courseId:String(cid)};
      save(); rerender();
    }).catch(function(err){ toast('AI 出题失败，改用基础自测：'+err.message); startBasic(cid,total); });
  } else startBasic(cid,total);
}
function startBasic(cid,total){
  var qs=basicQuestions(cid).slice(0,total);
  if(!qs.length){ toast('该课程暂无考点，请先导入课程章节数据'); return; }
  QUIZ_STATE={mode:'basic', questions:qs, i:0, answers:qs.map(function(){return null;}), fb:null, courseId:String(cid)};
  save(); rerender();
}
